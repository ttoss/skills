name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  front-matter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The skills CLI skips a skill whose front matter does not parse, so a
      # consumer's lock silently loses it.
      - name: Every SKILL.md front matter parses
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for path in sorted(glob.glob('skills/*/SKILL.md')):
              try:
                  meta = yaml.safe_load(open(path, encoding='utf-8').read().split('---', 2)[1])
                  assert meta.get('name') == path.split('/')[1], 'name differs from its directory'
                  assert meta.get('description'), 'no description'
              except Exception as error:
                  bad.append(f'{path}: {error}')
          print('\n'.join(bad) or 'every front matter parses')
          sys.exit(1 if bad else 0)
          PY

  flow-planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The planner decides the tick's transitions; each row of the process's
      # transition table has a fixture here.
      - name: Planner tests
        run: node --test "skills/flow/scripts/*.test.mjs"
